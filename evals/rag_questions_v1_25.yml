# Livrable 3.1 — 25 questions cibles pour le corpus RAG PrevCorp (v1)
# Changements vs v0 :
#   - sources_attendues = liste de doc_id (nom de fichier sans extension), plus de texte libre
#   - sources_attendues: [] pour les questions sans_reponse (retrieval = N/A)
#   - contexte_isole : champ OPTIONNEL, présent uniquement quand il diverge de sources_attendues
#     (défaut = sources_attendues). Utilisé par le run génération isolée.
#   - RC25 : réponse réécrite (conjoint, puis enfants, puis héritiers ; la Notice s'applique)
#   - RC08 : rente éducation retirée de la réponse (couverte par RC09)
#
# doc_id valides (= stems de corpus_src/*.html) :
#   REGLEMENT_prevcorp
#   NOTICE_CCN_metallurgie              (vraie notice)
#   NOTICE_CCN_metallurgie_distracteur  (piège : ne doit JAMAIS être une source attendue)
#   NOTICE_CCN_transport_routier
#   NOTICE_CCN_sante_action_sociale
#   NOTICE_CCN_agriculture
#   RESUME_C20077 / RESUME_C39949 / RESUME_C73736 / RESUME_C83792 / RESUME_C87656
#   FAQ_prevcorp
#
# Contrats-ancres partie 1 : C87656 (CADRE, Santé et action sociale) / C83792 (ENSEMBLE DU PERSONNEL, Enseignement privé) / C39949 (NON CADRE, Agriculture)
# Contrats-ancres partie 2 : C73736 (Métallurgie, CADRE) / C20077 (Transport routier, NON CADRE)

questions:

  - id: RC01
    question: "Quel est le délai de franchise de la garantie Incapacité Temporaire de Travail du contrat C87656 ?"
    type: chiffre_precis
    contrat_cible: C87656
    reponse_attendue: "90 jours"
    sources_attendues: [RESUME_C87656]
    corpus_a_contenir: "Résumé C87656 : ligne garantie ITT, franchise = 90 jours"

  - id: RC02
    question: "Le contrat C87656 prévoit-il un délai de carence avant la prise d'effet de la garantie ITT, et si oui lequel ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: "Oui, 3 mois"
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C87656]
    corpus_a_contenir: >
      Règlement : article définissant le principe de carence.
      Résumé C87656 : ligne garantie ITT avec délai de carence = 3 mois.

  - id: RC03
    question: "Le concubin est-il inclus dans la désignation de bénéficiaire type du contrat C87656 ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: >
      Oui selon la Notice CCN Santé et action sociale (concubin inclus sous condition de résidence commune),
      alors que le Règlement générique ne le mentionne pas — écart délibéré entre les deux documents.
    sources_attendues: [REGLEMENT_prevcorp, NOTICE_CCN_sante_action_sociale]
    corpus_a_contenir: >
      Règlement : clause bénéficiaire type = conjoint ou pacsé, à défaut enfants, à défaut parents, à défaut ascendants, à défaut héritiers (pas de mention du concubin).
      Notice CCN Santé et action sociale : même clause + concubin sous condition de résidence commune — écart délibéré à injecter.

  - id: RC04
    question: "Le contrat C39949 couvre-t-il un rapatriement à l'étranger en cas de sinistre ?"
    type: sans_reponse
    contrat_cible: C39949
    reponse_attendue: "Non — cette couverture n'apparaît dans aucun document du corpus."
    sources_attendues: []
    contexte_isole: [RESUME_C39949]
    corpus_a_contenir: "Absence volontaire et vérifiée : aucune mention de rapatriement à l'étranger dans le Règlement ni ailleurs."

  - id: RC05
    question: "Y a-t-il un écart entre le Résumé des garanties du contrat C39949 et la Notice CCN Agriculture sur la garantie ITT ?"
    type: croisement
    contrat_cible: C39949
    reponse_attendue: "Oui — Résumé C39949 indique une franchise ITT de 60 jours, alors que la Notice CCN Agriculture indique 90 jours."
    sources_attendues: [RESUME_C39949, NOTICE_CCN_agriculture]
    corpus_a_contenir: "Résumé C39949 : franchise ITT = 60 jours. Notice CCN Agriculture : franchise ITT = 90 jours — écart délibéré à injecter."

  - id: RC06
    question: "Quel est le taux de couverture de l'invalidité sur le contrat C39949, pour les 3 catégories ?"
    type: croisement
    contrat_cible: C39949
    reponse_attendue: "Invalidité 1re catégorie : 35 % (tranches A et B) et 25 % (tranche C) ; 2e catégorie : 45 % (A et B) et 35 % (C) ; 3e catégorie : 70 % (A et B) et 55 % (C) du salaire annuel brut de référence."
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C39949]
    corpus_a_contenir: "Règlement : définition des 3 catégories d'invalidité. Résumé C39949 : taux de couverture par catégorie."

  - id: RC07
    question: "Quel est le taux de couverture de l'incapacité sur le contrat C87656, et la franchise associée ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: "Indemnité journalière de 82 % du salaire de référence en tranche A et 78 % en tranche B, après une franchise contractuelle de 90 jours."
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C87656]
    corpus_a_contenir: "Règlement : définition de la garantie incapacité. Résumé C87656 : taux de couverture ITT + jours de franchise."

  - id: RC08
    question: "Quelles sont les garanties décès prévues par le contrat C83792 ?"
    type: chiffre_precis
    contrat_cible: C83792
    reponse_attendue: "Capital décès toutes causes : 140 % (TA/TB) et 115 % (TC) pour un célibataire, veuf ou divorcé sans enfant à charge ; 160 % (TA/TB) et 135 % (TC) pour un marié ou pacsé sans enfant à charge ; majoration de +28 % (TA/TB) / +18 % (TC) par enfant à charge. Autres garanties : invalidité absolue et définitive 100 %, décès accidentel 100 %, double effet 100 %, obsèques 1 900 € (forfait)."
    sources_attendues: [RESUME_C83792]
    corpus_a_contenir: "Résumé C83792 : table complète des garanties décès (capitaux, obsèques). La rente éducation est testée à part (RC09)."

  - id: RC09
    question: "Une rente éducation est-elle prévue sur le contrat C83792 ?"
    type: chiffre_precis
    contrat_cible: C83792
    reponse_attendue: "Oui. Rente éducation annuelle versée jusqu'à la fin des études et au plus tard au 26e anniversaire : 5,5 % jusqu'à 11 ans, 8 % de 12 à 17 ans, 11 % de 18 à 25 ans (études ou apprentissage)."
    sources_attendues: [RESUME_C83792]
    corpus_a_contenir: "Résumé C83792 : table de la rente éducation."

  - id: RC10
    question: "Y a-t-il des garanties optionnelles disponibles sur le contrat C87656 ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: "Oui, deux garanties optionnelles souscrites sur C87656 : la rente de conjoint (15 % en tranche A et en tranche B) et la garantie obsèques (capital forfaitaire de 2 500 €)."
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C87656]
    corpus_a_contenir: "Règlement : catalogue des garanties optionnelles possibles. Résumé C87656 : lesquelles sont effectivement souscrites."

  - id: RC11
    question: "Le contrat C73736 prévoit-il une franchise continue ou discontinue pour la garantie Incapacité Temporaire de Travail, et cela correspond-il au régime par défaut du Règlement ou à une dérogation CCN ?"
    type: croisement
    contrat_cible: C73736
    reponse_attendue: "Franchise continue (le délai de 90 jours court sans interruption dès le premier jour d'arrêt). C'est le régime de base de la convention : la Notice CCN Métallurgie précise qu'elle ne prévoit aucune dérogation à cette modalité."
    sources_attendues: [REGLEMENT_prevcorp, NOTICE_CCN_metallurgie]
    corpus_a_contenir: "Règlement : définit les deux types de franchise (continue/discontinue). Notice CCN Métallurgie : précise le type retenu pour C73736."

  - id: RC12
    question: "Quel est le taux de la rente invalidité 2e catégorie sur la tranche B pour le contrat C73736 ?"
    type: chiffre_precis
    contrat_cible: C73736
    reponse_attendue: "50 % du salaire annuel brut de référence en tranche B (invalidité 2e catégorie)."
    sources_attendues: [RESUME_C73736]
    corpus_a_contenir: "Résumé C73736 : tableau des taux d'invalidité par catégorie et par tranche (TA/TB/TC)."

  - id: RC13
    question: "Le contrat C73736 applique-t-il la clause bénéficiaire type (conjoint puis enfants puis héritiers) ou une clause personnalisée déclarée à l'assureur ? Si personnalisée, quelle répartition ?"
    type: croisement
    contrat_cible: C73736
    reponse_attendue: "Clause bénéficiaire type : aucune désignation personnalisée n'a été notifiée pour C73736, donc la clause type s'applique de plein droit, sans répartition personnalisée (conjoint ou partenaire de PACS, à défaut enfants par parts égales, à défaut parents, à défaut autres ascendants, à défaut héritiers)."
    sources_attendues: [NOTICE_CCN_metallurgie, RESUME_C73736]
    corpus_a_contenir: "Notice CCN Métallurgie : rappel de la clause type. Résumé ou annexe C73736 : indication d'une clause personnalisée avec répartition (ou absence = clause type par défaut)."

  - id: RC14
    question: "Quel document justificatif faut-il fournir en cas de décès pour prouver la qualité de concubin ?"
    type: fait_simple
    contrat_cible: null
    reponse_attendue: "Une attestation de vie commune ou, à défaut, deux justificatifs de domicile commun de plus de deux ans (Règlement, annexe I, pièces justificatives de la garantie décès)."
    sources_attendues: [REGLEMENT_prevcorp]
    corpus_a_contenir: "Règlement, annexe pièces justificatives : liste des documents à fournir pour justifier la qualité de concubin."

  - id: RC15
    question: "Quelle est la durée de la franchise avant le versement des indemnités journalières en cas d'arrêt maladie ordinaire ?"
    type: fait_simple
    contrat_cible: null
    reponse_attendue: "90 jours, décomptés en jours calendaires à partir du premier jour de l'arrêt de travail."
    sources_attendues: [FAQ_prevcorp]
    corpus_a_contenir: "FAQ : question dédiée sur la franchise avant versement des IJ en maladie ordinaire."

  - id: RC16
    question: "Le jour de carence en congé maladie ordinaire est-il inclus dans le décompte de la franchise de 90 jours ?"
    type: croisement
    contrat_cible: null
    reponse_attendue: "Non. Le jour de carence de la Sécurité sociale et la franchise contractuelle de 90 jours sont deux notions distinctes : la franchise démarre au premier jour de l'arrêt, que ce jour soit ou non pris en charge par la Sécurité sociale."
    sources_attendues: [REGLEMENT_prevcorp, FAQ_prevcorp]
    corpus_a_contenir: "Règlement : définition générale de la franchise. FAQ : précision spécifique sur le traitement du jour de carence dans le décompte."

  - id: RC17
    question: "Quel est le taux de cotisation salarié pour la garantie rente de conjoint sur le contrat C73736 ?"
    type: sans_reponse
    contrat_cible: C73736
    reponse_attendue: "Non — la garantie rente de conjoint n'est pas souscrite sur ce contrat, donc aucun taux n'existe dans le corpus."
    sources_attendues: []
    contexte_isole: [RESUME_C73736]
    corpus_a_contenir: >
      Absence délibérée et vérifiée de la rente de conjoint dans le Résumé C73736 (pas une simple omission).
      Piège voulu : la Notice Métallurgie (vraie et distracteur) cite la rente de conjoint comme garantie optionnelle (art. 16).

  - id: RC18
    question: "Quel est le montant du capital décès toutes causes pour un salarié célibataire sans personne à charge sur le contrat C20077 ?"
    type: chiffre_precis
    contrat_cible: C20077
    reponse_attendue: "120 % du salaire annuel brut de référence (tranches A et B)."
    sources_attendues: [RESUME_C20077]
    corpus_a_contenir: "Résumé C20077 : ligne capital décès toutes causes, situation célibataire sans personne à charge."

  - id: RC19
    question: "Le contrat C20077 applique-t-il une majoration de capital décès par enfant à charge, et à quel taux ?"
    type: croisement
    contrat_cible: C20077
    reponse_attendue: "Oui : majoration de 25 % du capital décès toutes causes par enfant à charge reconnu au jour du sinistre (tranches A et B), cumulable sans limitation de rang ; principe posé par la Notice CCN Transport routier, taux fixé par le Résumé C20077."
    sources_attendues: [NOTICE_CCN_transport_routier, RESUME_C20077]
    corpus_a_contenir: "Notice CCN Transport routier : mécanisme de majoration par enfant à charge. Résumé C20077 : taux appliqué."

  - id: RC20
    question: "Le taux de couverture invalidité 1re catégorie du contrat C20077 est-il le taux de base du Règlement ou une dérogation CCN ?"
    type: croisement
    contrat_cible: C20077
    reponse_attendue: "Taux de base : 50 % en 1re catégorie sur C20077 (tranches A et B), soit le taux de base de l'article 15 du Règlement, sans dérogation CCN."
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C20077]
    corpus_a_contenir: "Règlement : taux de base pour l'invalidité 1re catégorie. Résumé C20077 : taux effectivement appliqué, à comparer."

  - id: RC21
    question: "Quelles sont les 3 catégories d'invalidité et comment sont-elles déterminées ?"
    type: fait_simple
    contrat_cible: null
    reponse_attendue: "1re catégorie : invalides capables d'exercer une activité rémunérée ; 2e catégorie : invalides absolument incapables d'exercer une profession quelconque ; 3e catégorie : idem, avec en plus recours nécessaire à l'assistance d'une tierce personne pour les actes ordinaires de la vie. La catégorie est déterminée par le médecin conseil de la Sécurité sociale, notifiée par la CPAM puis communiquée à l'assureur."
    sources_attendues: [FAQ_prevcorp]
    corpus_a_contenir: "FAQ : question dédiée sur les 3 catégories d'invalidité et l'autorité qui les détermine."

  - id: RC22
    question: "Le délai de prescription pour une action en incapacité de travail est-il de 2 ans ou de 5 ans sur le contrat C20077 ?"
    type: croisement
    contrat_cible: C20077
    reponse_attendue: "5 ans. Le Règlement fixe 2 ans par défaut, mais la Notice CCN Transport routier déroge et porte à 5 ans le délai de prescription pour la garantie incapacité de travail."
    sources_attendues: [REGLEMENT_prevcorp, NOTICE_CCN_transport_routier]
    corpus_a_contenir: "Règlement : délai de prescription générique. Notice CCN Transport routier : délai spécifique pour l'incapacité de travail si différent."

  - id: RC23
    question: "Que doit faire un salarié du contrat C20077 en arrêt de travail pour percevoir ses indemnités journalières, et à quel taux sont-elles versées ?"
    type: croisement
    contrat_cible: C20077
    reponse_attendue: "Transmettre l'avis d'arrêt initial (et prolongations) à l'employeur sous 48 heures ; l'employeur déclare l'arrêt à l'assureur sous 8 jours avec copie de l'avis médical et les bulletins de salaire des 3 derniers mois (espace adhérent en ligne ou courrier au service prestations). Les IJ sont versées après la franchise, au taux de 78 % en tranche A et 72 % en tranche B."
    sources_attendues: [FAQ_prevcorp, RESUME_C20077]
    corpus_a_contenir: >
      FAQ : étapes opérationnelles de déclaration d'un arrêt de travail (démarches, délais, contact).
      Résumé C20077 : taux de versement des indemnités journalières.
      Point de vigilance : la FAQ ne doit PAS contenir le taux (sinon le croisement n'en est plus un).

  - id: RC24
    question: "Sur un contrat où le concubin est reconnu bénéficiaire (ex. C87656), quel montant perçoit-il en cas de décès ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: "Le concubin est éligible selon la Notice CCN Santé et action sociale (sous condition de résidence commune au jour du décès) et perçoit le capital décès de la clause type, sans montant spécifique pour lui : les taux du Résumé C87656 s'appliquent, soit 180 % du salaire annuel brut de référence (tranches A et B) pour un assuré sans personne à charge, majoré de 25 % par enfant à charge."
    sources_attendues: [NOTICE_CCN_sante_action_sociale, RESUME_C87656]
    corpus_a_contenir: "Réutilise l'écart déjà injecté pour RC03. Notice CCN : confirme l'éligibilité du concubin. Résumé : montant du capital."

  - id: RC25
    question: "Sur le contrat C20077, où le concubin n'est pas reconnu bénéficiaire, à qui est versé le capital décès si aucune désignation n'a été faite ?"
    type: fait_simple
    contrat_cible: C20077
    reponse_attendue: "La clause bénéficiaire type de la Notice CCN Transport routier s'applique (elle porte les dispositions particulières de la convention, là où le Règlement fixe le socle commun) : le capital est versé au conjoint ou partenaire de PACS de l'assuré ; à défaut, aux enfants par parts égales ; à défaut, aux héritiers. Le concubin n'est pas reconnu par la convention (Annexe II) et n'ouvre aucun droit."
    sources_attendues: [NOTICE_CCN_transport_routier]
    corpus_a_contenir: >
      Notice CCN Transport routier : clause type (conjoint, enfants, héritiers) + Annexe II confirmant la non-reconnaissance du concubin.
      Règlement : clause type du socle commun (avec parents et ascendants) — diffère volontairement de la Notice.
      Une réponse qui suit la clause du Règlement (parents, ascendants) est fausse pour ce contrat.
