# Livrable 3.1 — 25 questions cibles pour le corpus RAG PrevCorp (v1)
# Changements vs v0 :
#   - sources_attendues = liste de doc_id (nom de fichier sans extension), plus de texte libre
#   - sources_attendues: [] pour les questions sans_reponse (retrieval = N/A)
#   - contexte_isole : champ OPTIONNEL, présent uniquement quand il diverge de sources_attendues
#     (défaut = sources_attendues). Utilisé par le run génération isolée.
#   - RC25 : réponse réécrite (conjoint, puis enfants, puis héritiers ; la Notice s'applique)
#   - RC08 : rente éducation retirée de la réponse (couverte par RC09)
#
# Contrats-ancres partie 1 : C87656 (CADRE, Santé et action sociale) / C83792 (ENSEMBLE DU PERSONNEL, Enseignement privé) / C39949 (NON CADRE, Agriculture)
# Contrats-ancres partie 2 : C73736 (Métallurgie, CADRE) / C20077 (Transport routier, NON CADRE)

questions:

  - id: RC01
    question: "Quel est le délai de franchise de la garantie Incapacité Temporaire de Travail du contrat C87656 ?"
    type: chiffre_precis
    contrat_cible: C87656
    reponse_attendue: "90 jours"
    sources_attendues: [RESUME_C87656]
    corpus_a_contenir: "Résumé C87656 : ligne garantie ITT, franchise = 90 jours"
    points_obligatoires:
      - id: O0
        texte: "Franchise ITT de 90 jours"
        formes: ["90 jours"]
        verif: deterministe
    points_interdits:
      - id: I0
        texte: "Franchise de 60 jours (autre contrat)"
        formes: ["60 jours"]
        verif: deterministe

  - id: RC02
    question: "Le contrat C87656 prévoit-il un délai de carence avant la prise d'effet de la garantie ITT, et si oui lequel ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: "Oui, 3 mois"
    sources_attendues: [REGLEMENT_prevcorp, RESUME_C87656]
    corpus_a_contenir: >
      Règlement : article définissant le principe de carence.
      Résumé C87656 : ligne garantie ITT avec délai de carence = 3 mois.
    points_obligatoires:
      - id: O0
        texte: "Un délai de carence de 3 mois s'applique avant la prise d'effet de l'ITT"
        formes: ["3 mois"]
        verif: deterministe
      - id: O1
        texte: "La réponse confirme qu'il existe bien un délai de carence"
        formes: ["délai de carence"]
        verif: juge

  - id: RC03
    question: "Le concubin est-il inclus dans la désignation de bénéficiaire type du contrat C87656 ?"
    type: croisement
    contrat_cible: C87656
    reponse_attendue: >
      Oui selon la Notice CCN Santé et action sociale (concubin inclus sous condition de résidence commune),
      alors que le Règlement générique ne le mentionne pas — écart délibéré entre les deux documents.
    sources_attendues: [REGLEMENT_prevcorp, NOTICE_CCN_sante_action_sociale]
    corpus_a_contenir: >
      Règlement : clause bénéficiaire type = conjoint ou pacsé, à défaut enfants, à défaut parents, à défaut ascendants, à défaut héritiers (pas de mention du concubin).
      Notice CCN Santé et action sociale : même clause + concubin sous condition de résidence commune — écart délibéré à injecter.
    points_obligatoires:
      - id: O0
        texte: "La Notice CCN Santé et action sociale inclut le concubin, sous condition de résidence commune"
        formes: ["concubin"]
        verif: juge
      - id: O1
        texte: "Le Règlement générique ne mentionne pas le concubin : écart entre les deux documents"
        formes: ["conjoint"]
        verif: juge

