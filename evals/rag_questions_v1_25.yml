  - id: RC25
    question: "Sur le contrat C20077, où le concubin n'est pas reconnu bénéficiaire, à qui est versé le capital décès si aucune désignation n'a été faite ?"
    type: fait_simple
    contrat_cible: C20077
    reponse_attendue: "La clause bénéficiaire type de la Notice CCN Transport routier s'applique (elle porte les dispositions particulières de la convention, là où le Règlement fixe le socle commun) : le capital est versé au conjoint ou partenaire de PACS de l'assuré ; à défaut, aux enfants par parts égales ; à défaut, aux héritiers. Le concubin n'est pas reconnu par la convention (Annexe II) et n'ouvre aucun droit."
    sources_attendues: [NOTICE_CCN_transport_routier]
    corpus_a_contenir: >
      Notice CCN Transport routier : clause type (conjoint, enfants, héritiers) + Annexe II confirmant la non-reconnaissance du concubin.
      Règlement : clause type du socle commun (avec parents et ascendants) — diffère volontairement de la Notice.
      Une réponse qui suit la clause du Règlement (parents, ascendants) est fausse pour ce contrat.
    points_obligatoires:
      - id: O0
        texte: "La clause type de la Notice CCN Transport routier s'applique : conjoint ou partenaire de PACS, à défaut enfants par parts égales, à défaut héritiers"
        formes: ["conjoint"]
        verif: juge
      - id: O1
        texte: "Le concubin n'est pas reconnu par la convention et n'ouvre aucun droit"
        formes: ["concubin"]
        verif: juge
    points_interdits:
      - id: I0
        texte: "La réponse désigne les parents ou les ascendants comme bénéficiaires"
        formes: ["parents", "ascendants"]
        verif: juge
