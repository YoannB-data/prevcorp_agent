# Eval set ROUTING PrevCorp — v1, 70 questions (sql 25, rag 25, hybride 20)
# sql : 18 simple + 7 piege ; rag : 20 simple + 5 piege ; hybride : 12 explicite + 4 implicite + 4 dependante
# Mesure l'ÉTIQUETTE de route, pas la calculabilité de la réponse : une hybride dont le SQL renvoie 0 reste valide.
# Revue de faisabilité des hybrides RT-H01 à RT-H10 : evals/review_hybrides_v0.md (RT-H08 rejetée, absente).
# Questions dépendantes (forme: dependante) : étiquetées, hors périmètre d'exécution v1.
#
# Conventions :
#   - id : RT-S (sql tirées de evals/sql/eval_set.yml), RT-R (rag tirées de evals/rag/eval_set.yml),
#     RT-H (hybrides), RT-P (pièges)
#   - origine : id source (texte copié à l'identique), review_hybrides_v0, ou nouvelle
#   - reponse_attendue : optionnelle, remplie plus tard pour l'éval end-to-end

meta:
  version: "1.0"
  date: "2026-10-16"
  total: 70
  comptes:
    sql: {simple: 18, piege: 7}
    rag: {simple: 20, piege: 5}
    hybride: {explicite: 12, implicite: 4, dependante: 4}
  classes: [sql, rag, hybride]
  critere: "match strict de route_attendue"
  formes:
    - simple      # question reprise d'un eval set mono-pipeline
    - explicite   # hybride, deux demandes reliées par « et »
    - implicite   # hybride sans « et » : le besoin des deux sources se déduit
    - dependante  # hybride dont une partie a besoin de la sortie de l'autre (exécution séquentielle)
    - piege       # vocabulaire de l'autre pipeline que celui attendu
  metriques:
    - accuracy
    - matrice_de_confusion
    - rappel_hybride        # métrique de décision
    - latence
    - cout
    - determinisme          # 3 runs, même étiquette attendue
    - marge_similarite_top1_top2   # routeur sémantique uniquement
  seuils:
    accuracy: 0.90
    rappel_hybride: 0.80

