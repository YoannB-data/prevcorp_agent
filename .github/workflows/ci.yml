name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: black — format check
        run: uv run black --check src/ tests/ evals/

      - name: isort — import order check
        run: uv run isort --check src/ tests/ evals/

      - name: pylint — score 10/10
        run: uv run pylint src/ tests/ evals/ --fail-under=10

      - name: pytest — unit tests
        run: uv run pytest tests/
